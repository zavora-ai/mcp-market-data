[package]
name = "mcp-market-data"
version = "1.1.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["James Karanja <james.karanja@zavora.ai>"]
description = "Market Data MCP Server — a market-data platform (instruments, real-time quotes and historical bars, analytics for returns/volatility/correlation/moving averages, yield & forward curves with interpolation, FX conversion, benchmarks/indices, watchlists, price alerts, and demand/price forecasting) with an optional live backend (Yahoo Finance quotes/history + ECB/Frankfurter FX) and a published-mark audit trail"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-market-data"
homepage = "https://enterprise.adk-rust.com"
keywords = ["mcp", "market-data", "finance", "analytics", "forecasting"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
adk-mcp-sdk = { version = "0.2.0", git = "https://github.com/zavora-ai/adk-mcp-sdk.git", rev = "4dac4301441a8a51a042fd66cc1798f0ec3e3f55" }
rmcp = { version = "3.1.2", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[workspace]
