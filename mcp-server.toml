server_id = "mcp_market_data"
display_name = "Market Data"
version = "1.0.0"
domain = "banking"
sdk_version = "0.1.0"
risk_level = "medium"
writes_allowed = "gated"
transports = ["stdio"]
credentials = []
governance_gates = []
environments = ["development", "staging", "production"]

